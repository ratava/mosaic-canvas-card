title: "Mosaic Canvas Card"
description: "Documentation for the Mosaic Canvas Card custom Lovelace card for Home Assistant"

remote_theme: "mmistakes/minimal-mistakes"
minimal_mistakes_skin: "dark"

url: "https://ratava.github.io"
baseurl: "/mosaic-canvas-card"
repository: "ratava/mosaic-canvas-card"

markdown: kramdown

plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-paginate
  - jekyll-sitemap

include:
  - _pages

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor

author:
  name: "Brent Wesley"

footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/ratava/mosaic-canvas-card"

defaults:
  - scope:
      path: ""
    values:
      layout: single
      author_profile: false
      toc: true
      sidebar:
        nav: "docs"
